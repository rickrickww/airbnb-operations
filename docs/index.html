<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#42362e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">
<title>Guest Guides</title>
<!--
  Landing page for the Pages site, so the root isn't a 404.
  Guests never see this - their QR codes point straight at a unit.
-->
<style>
  :root {
    --ink: #42362e; --taupe: #a8917f; --stone: #d2ccc4;
    --bg: #f7f9f6; --card: #fff; --text: #42362e; --line: #e7e2da;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1814; --card: #2a231e; --text: #f1ece5; --line: #3b322b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1814; --card: #2a231e; --text: #f1ece5; --line: #3b322b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
  }
  .box { width: 100%; max-width: 420px; text-align: center; }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 500; font-size: 30px; margin: 0 0 6px; letter-spacing: -.01em;
  }
  p.sub { margin: 0 0 22px; color: var(--taupe); font-size: 15px; }
  a.unit {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    text-decoration: none; color: var(--text); font-weight: 600;
    box-shadow: 0 1px 3px rgba(66,54,46,.07);
  }
  a.unit span { display: block; font-weight: 400; font-size: 14px; color: var(--taupe); margin-top: 2px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Guest Guides</h1>
    <p class="sub">Choose your unit</p>
    <a class="unit" href="unit-2/">Unit 2<span>Everything about your stay</span></a>
  </div>
</body>
</html>
